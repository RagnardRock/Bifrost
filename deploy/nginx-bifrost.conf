# Bifrost lui-même (interface, éditeur, API) : à copier dans /etc/nginx/sites-available/.
# Le HTTPS est ajouté ensuite par certbot (voir LISEZMOI.md).

server {
    listen 80;
    listen [::]:80;
    server_name bifrost.ragnardrock.fr;

    # Photos envoyées depuis l'éditeur
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
