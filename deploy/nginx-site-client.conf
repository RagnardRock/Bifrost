# Un site client servi en direct depuis sa version en ligne.
# Une copie par site : remplacer DOMAINE et ID_DU_SITE (l'identifiant se lit dans l'adresse de sa fiche,
# /admin/sites/<ID_DU_SITE>), puis certbot pour le HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE www.DOMAINE;

    root /srv/bifrost/donnees/sites/ID_DU_SITE/publie;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Une publication change les pages : le navigateur redemande toujours le HTML
    location ~* \.html?$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|js|png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
        expires 7d;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
