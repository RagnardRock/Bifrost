# Un site client servi en direct depuis sa version en ligne.
# Une copie par site : remplacer DOMAINE et ID_DU_SITE (l'identifiant est affiché en bas
# de sa fiche, « Zone sensible »), puis certbot pour le HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE www.DOMAINE;

    root /srv/bifrost/donnees/sites/ID_DU_SITE/publie;
    index index.html;

    # Site mis en pause depuis l'espace dev : Bifrost dépose pause.html à côté de publie/
    error_page 503 @pause;
    location @pause {
        root /srv/bifrost/donnees/sites/ID_DU_SITE;
        try_files /pause.html =503;
    }

    location / {
        if (-f /srv/bifrost/donnees/sites/ID_DU_SITE/pause.html) { return 503; }
        try_files $uri $uri.html $uri/ =404;
    }

    # Une publication change les pages : le navigateur redemande toujours le HTML
    location ~* \.html?$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|js|png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
        expires 7d;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
