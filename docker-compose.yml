# Bifrost en ligne : la base Postgres et le serveur.
# Les réglages viennent du fichier .env posé à côté (voir deploy/LISEZMOI.md).

services:
  postgres:
    image: postgres:16-alpine
    container_name: bifrost-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bifrost
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      POSTGRES_DB: bifrost
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bifrost']
      interval: 10s
      timeout: 5s
      retries: 5

  bifrost:
    build: .
    container_name: bifrost-server
    restart: unless-stopped
    # Seulement sur la machine : c'est Caddy qui reçoit le public (HTTPS) et renvoie ici
    ports:
      - '127.0.0.1:${PORT_LOCAL:-3100}:3000'
    environment:
      DATABASE_URL: postgresql://bifrost:${DB_PASSWORD}@postgres:5432/bifrost?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      DEUX_FACTEURS_CLE: ${DEUX_FACTEURS_CLE:-}
      APP_URL: ${APP_URL:?APP_URL manquant dans .env}
      CORS_ORIGINS: ${APP_URL}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Réseaux sociaux : appli Meta « API Instagram avec connexion Instagram » (vide = carte Instagram indisponible)
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
    volumes:
      # Les fichiers des sites (brouillon, version en ligne, historique)
      - ${SITES_DIR:-./donnees/sites}:/data/sites
      # Les dossiers déposés pour un import ou un réimport
      - ${IMPORT_DIR:-./donnees/import}:/data/import
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
