<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c12">
<title>Pas de connexion · Bifrost</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font: 16px/1.5 system-ui, -apple-system, sans-serif; background: #f4f4f7; color: #18181b; text-align: center; }
  main { max-width: 360px; display: grid; gap: 14px; justify-items: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { margin: 6px 0 0; font-size: 22px; }
  p { margin: 0; color: #52525b; }
  button { margin-top: 8px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: linear-gradient(135deg, #8b5cf6, #e07a4a); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  @media (prefers-color-scheme: dark) { body { background: #0b0c12; color: #e4e4e7; } p { color: #a1a1aa; } }
</style>
</head>
<body>
<main>
  <img src="/icones/icone-192.png" alt="">
  <h1>Pas de connexion</h1>
  <p>Bifrost a besoin d’Internet pour modifier votre site. Vérifiez le Wi-Fi ou les données mobiles.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
</main>
<script>addEventListener('online', () => location.reload())</script>
</body>
</html>
