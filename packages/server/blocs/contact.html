<!-- {"nom": "Formulaire de contact", "icone": "✉️", "description": "Formulaire branché sur Bifrost (messages dans 📨)"} -->
<section class="bfb bfb-contact">
  <div class="bfb-conteneur bfb-etroit">
    <h2 data-bf="contact.titre">Nous écrire</h2>
    <p data-bf="contact.texte">Une question ? Laissez-nous un message, nous vous répondons rapidement.</p>
    <form class="bfb-formulaire" data-bf-formulaire="contact">
      <label>Nom <input name="nom" required autocomplete="name"></label>
      <label>E-mail <input type="email" name="email" required autocomplete="email"></label>
      <label>Message <textarea name="message" rows="5" required></textarea></label>
      <button class="bfb-bouton" type="submit">Envoyer</button>
    </form>
  </div>
</section>
